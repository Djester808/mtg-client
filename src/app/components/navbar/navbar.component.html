<nav
  class="fixed top-0 left-0 right-0 z-[1000] h-[52px] flex items-center px-6 gap-8 bg-[rgba(8,8,8,0.85)] backdrop-blur-[12px] border-b border-solid border-dim"
>
  <a
    class="nav-logo flex items-center gap-2 no-underline shrink-0"
    routerLink="/"
    (click)="closeMenu()"
  >
    <span class="compleat-brand" role="img" aria-label="Compleat"
      ><img class="compleat-sigil" src="assets/brand/sigil.png" alt="" /><img
        class="compleat-wordmark"
        src="assets/brand/wordmark.png"
        alt=""
    /></span>
  </a>

  <div class="nav-links flex items-center gap-1 flex-1">
    <a
      *ngFor="let link of navLinks"
      class="nav-link py-1.5 px-3 font-display text-[length:calc(11px*var(--text-scale,1))] font-semibold tracking-[0.1em] uppercase text-parchment-muted no-underline rounded-md transition-[color,background] duration-150 hover:text-parchment hover:bg-raised"
      [routerLink]="link.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: link.exact }"
      >{{ link.label }}</a
    >
  </div>

  <a class="nav-settings" routerLink="/settings" aria-label="Settings" title="Settings">⚙</a>
  <div class="account-menu flex items-center gap-2 relative shrink-0">
    <ng-container *ngIf="isLoggedIn$ | async; else loggedOut">
      <button
        class="account-btn flex items-center gap-2 py-1.5 px-3 bg-raised border border-solid border-dim rounded-lg cursor-pointer transition-[border-color,background] duration-150 hover:border-subtle hover:bg-elevated"
        (click)="toggleAccount()"
      >
        <app-user-avatar
          [username]="accountHandle()"
          [displayName]="accountName()"
          [avatarUrl]="avatarUrl()"
          [size]="24"
        ></app-user-avatar>
        <span
          class="account-name font-display text-[length:calc(11px*var(--text-scale,1))] font-semibold tracking-[0.08em] text-parchment max-w-[120px] overflow-hidden text-ellipsis whitespace-nowrap"
          >{{ accountName() }}</span
        >
        <span
          class="account-caret text-[length:calc(8px*var(--text-scale,1))] text-parchment-faint transition-transform duration-200"
          [class.open]="accountOpen()"
          >&#9660;</span
        >
      </button>
      <div class="account-dropdown animate-dropdown-in" *ngIf="accountOpen()">
        <a
          class="dropdown-item block w-full py-2 px-3 font-body text-[length:calc(13px*var(--text-scale,1))] text-parchment-muted no-underline bg-transparent border-none rounded-md cursor-pointer text-left transition-[background,color] duration-[120ms] hover:bg-raised hover:text-parchment"
          routerLink="/account"
          >Profile</a
        >
        <a class="dropdown-item" routerLink="/account/security">Account &amp; security</a>
        <div class="h-px bg-[rgba(255,255,255,0.06)] my-1"></div>
        <button
          class="dropdown-item danger block w-full py-2 px-3 font-body text-[length:calc(13px*var(--text-scale,1))] no-underline bg-transparent border-none rounded-md cursor-pointer text-left transition-[background,color] duration-[120ms]"
          (click)="signOut()"
        >
          Sign Out
        </button>
      </div>
    </ng-container>

    <ng-template #loggedOut>
      <a
        class="nav-link py-1.5 px-3 font-display text-[length:calc(11px*var(--text-scale,1))] font-semibold tracking-[0.1em] uppercase text-parchment-muted no-underline rounded-md transition-[color,background] duration-150 hover:text-parchment hover:bg-raised"
        routerLink="/login"
        >Sign In</a
      >
      <a
        class="nav-btn py-[7px] px-4 bg-gold rounded-[7px] font-display text-[length:calc(11px*var(--text-scale,1))] font-bold tracking-[0.1em] uppercase text-[#ffffff] no-underline transition-[background,box-shadow] duration-150 hover:bg-[#ca33e9] hover:shadow-[0_2px_16px_rgba(184,0,224,0.3)]"
        routerLink="/register"
        >Create Account</a
      >
    </ng-template>
  </div>

  <!-- Collapsed-width control. Hidden above $bp-nav; it is the only way to reach the
       links and the account actions below it. -->
  <button
    type="button"
    class="nav-toggle"
    (click)="toggleMenu()"
    [class.is-open]="menuOpen()"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="mobile-nav"
    aria-label="Menu"
  >
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
  </button>
</nav>

<!-- Drawer. Rendered outside <nav> so it is not subject to the bar's 52px height and
     its own backdrop-filter, which would otherwise clip and blur it. -->
<div class="nav-scrim" *ngIf="menuOpen()" (click)="closeMenu()"></div>

<div class="mobile-nav" id="mobile-nav" *ngIf="menuOpen()">
  <a
    *ngFor="let link of navLinks"
    class="mobile-nav-link"
    [routerLink]="link.path"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: link.exact }"
    (click)="closeMenu()"
    >{{ link.label }}</a
  >

  <a class="mobile-nav-link" routerLink="/settings" (click)="closeMenu()">Settings</a>
  <div class="mobile-nav-rule"></div>

  <ng-container *ngIf="isLoggedIn$ | async; else loggedOutMobile">
    <p class="mobile-nav-user">
      <app-user-avatar
        [username]="accountHandle()"
        [displayName]="accountName()"
        [avatarUrl]="avatarUrl()"
        [size]="28"
      ></app-user-avatar>
      <span>{{ accountName() }}</span>
    </p>
    <a class="mobile-nav-link" routerLink="/account" (click)="closeMenu()">Profile</a>
    <a class="mobile-nav-link" routerLink="/account/security" (click)="closeMenu()"
      >Account &amp; security</a
    >
    <button type="button" class="mobile-nav-link danger" (click)="signOut()">Sign Out</button>
  </ng-container>

  <ng-template #loggedOutMobile>
    <a class="mobile-nav-link" routerLink="/login" (click)="closeMenu()">Sign In</a>
    <a class="mobile-nav-link accent" routerLink="/register" (click)="closeMenu()"
      >Create Account</a
    >
  </ng-template>
</div>

<aside
  class="desktop-rail"
  *ngIf="preferences.state().navigation !== 'top'"
  [class.is-expanded]="preferences.state().navigation === 'expanded'"
  aria-label="Main navigation"
>
  <a
    *ngFor="let link of navLinks; let index = index"
    [routerLink]="link.path"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: link.exact }"
    [attr.aria-label]="link.label"
    [attr.title]="link.label"
    ><span class="rail-symbol" aria-hidden="true">{{ navSymbols[index] }}</span
    ><span class="rail-label">{{ link.label }}</span></a
  >
  <a routerLink="/settings" routerLinkActive="active" aria-label="Settings" title="Settings"
    ><span class="rail-symbol" aria-hidden="true">⚙</span
    ><span class="rail-label">Settings</span></a
  >
</aside>
