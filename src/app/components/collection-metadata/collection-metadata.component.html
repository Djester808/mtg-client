<section class="collection-metadata">
  <h3>Owned card details</h3>
  <p>
    Purchase details and finish notes are private to you. Changes apply only to the selected finish.
  </p>
  <label
    >Finish<select name="finish" [(ngModel)]="finish" (ngModelChange)="load()" [disabled]="busy()">
      <option *ngFor="let item of finishes" [value]="item">
        {{ item === 'nonfoil' ? 'Nonfoil' : item === 'foil' ? 'Foil' : 'Etched' }}
      </option>
    </select></label
  >
  <p role="alert" *ngIf="error()">
    {{ error() }} <button type="button" (click)="load()">Try again</button>
  </p>
  <p role="status" *ngIf="notice()">{{ notice() }}</p>
  <form *ngIf="loaded()" #details="ngForm" (ngSubmit)="save()">
    <label
      >Language<input
        name="language"
        [(ngModel)]="language"
        minlength="2"
        maxlength="8"
        required
        placeholder="en, fr, ja…"
    /></label>
    <label
      >Condition<select name="condition" [(ngModel)]="condition">
        <option value="">Not specified</option>
        <option value="NM">Near mint</option>
        <option value="LP">Lightly played</option>
        <option value="MP">Moderately played</option>
        <option value="HP">Heavily played</option>
        <option value="DMG">Damaged</option>
      </select></label
    >
    <label
      >Purchase price<input
        name="purchasePrice"
        [(ngModel)]="purchasePrice"
        type="number"
        min="0"
        max="21474836.47"
        step="0.01"
    /></label>
    <label
      >Currency<input
        name="currency"
        [(ngModel)]="currency"
        maxlength="3"
        minlength="3"
        [required]="purchasePrice !== null"
        placeholder="USD"
    /></label>
    <label
      >Tags, separated by commas<input name="tags" [(ngModel)]="tags" maxlength="1300"
    /></label>
    <label
      >Notes for this finish<textarea
        name="finishNotes"
        [(ngModel)]="notes"
        maxlength="4000"
      ></textarea>
    </label>
    <button [disabled]="busy() || details.invalid">
      {{ busy() ? 'Saving…' : 'Save card details' }}
    </button>
  </form>
</section>
