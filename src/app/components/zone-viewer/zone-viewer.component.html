<dialog
  #viewerDialog
  aria-label="Zone viewer"
  (cancel)="close()"
  class="viewer-backdrop"
  *ngIf="vm$ | async as vm"
  (click)="onBackdropClick($event)"
>
  <section class="viewer-panel">
    <header class="viewer-header">
      <div>
        <h2 class="viewer-title">{{ vm.title }}</h2>
        <p class="viewer-count">
          {{ vm.count }} cards<span *ngIf="vm.cards.length"> · newest first</span>
        </p>
      </div>
      <button class="viewer-close" aria-label="Close zone viewer" (click)="close()">×</button>
    </header>
    <nav class="viewer-tabs" aria-label="Player zones">
      <button
        *ngFor="let pile of vm.piles; trackBy: trackZone"
        [attr.aria-pressed]="vm.zone === pile.key"
        (click)="pickZone(vm.playerId, pile.key)"
        [attr.data-zone]="pile.key"
      >
        {{ pile.name }} {{ pile.count }}
      </button>
    </nav>
    <div class="viewer-body" *ngIf="vm.cards.length; else emptyZone">
      <div
        *ngFor="let card of vm.cards; trackBy: trackByCard; let first = first"
        class="viewer-card-slot"
      >
        <button
          class="zone-card"
          [attr.aria-label]="card.name + '. Open details'"
          [style.--zone-color]="
            'var(--mana-' +
            ((card.colors ?? card.colorIdentity).length === 1
              ? (card.colors ?? card.colorIdentity)[0]
              : 'C') +
            ')'
          "
          (click)="$event.stopPropagation(); detail(card)"
          (contextmenu)="options($event, card)"
          (keydown)="optionsKey($event, card)"
        >
          <img
            *ngIf="card.imageUriNormal"
            class="zone-art"
            [src]="card.imageUriNormal"
            [alt]="card.name"
            draggable="false"
            #zoneArt
            (error)="zoneArt.hidden = true"
          />
          <strong class="viewer-card-name">{{ card.name }}</strong>
          <app-mana-cost [cost]="card.manaCost"></app-mana-cost>
          <span
            >{{ card.cardTypes.join(' ')
            }}<span *ngIf="card.subtypes.length"> — {{ card.subtypes.join(' ') }}</span></span
          >
          <span class="newest" *ngIf="first">Newest</span>
        </button>
        <button
          *ngIf="vm.isLocal && vm.zone === 'command'"
          class="viewer-cast"
          [disabled]="!vm.canCast.includes(card.cardId)"
          [title]="
            vm.canCast.includes(card.cardId)
              ? 'Cast commander'
              : 'Cannot cast this commander right now'
          "
          (click)="cast(card, vm.canCast.includes(card.cardId))"
        >
          Cast {{ card.name }}
        </button>
      </div>
    </div>
    <ng-template #emptyZone
      ><p class="viewer-empty">
        {{
          vm.hidden
            ? vm.count + ' cards, face down. Card identities are private.'
            : 'Nothing here yet.'
        }}
      </p></ng-template
    >
  </section>
  <app-card-options-menu
    *ngIf="contextCard"
    [x]="contextX"
    [y]="contextY"
    (inspect)="inspect()"
    (dismiss)="contextCard = null"
  ></app-card-options-menu>
</dialog>
