<ng-container *ngIf="{ targeting: isTargeting$ | async } as ui">
  <div class="stack-panel" *ngIf="(isEmpty$ | async) === false">
    <div class="stack-items">
      <ng-container *ngIf="stack$ | async as stack">
        <button
          *ngFor="let obj of stack; trackBy: trackByStackObj; let i = index"
          class="stack-item"
          type="button"
          [class.stack-item-top]="isTopOfStack(i, stack)"
          [class.is-targetable]="(isTargeting$ | async) === true"
          (click)="ui.targeting === true ? pick(obj) : inspectObject(obj)"
          (contextmenu)="options($event, obj)"
          (keydown)="optionsKey($event, obj)"
        >
          <div class="stack-item-index">
            {{ isTopOfStack(i, stack) ? 'Resolves next' : '#' + (stack.length - i) }}
          </div>
          <div class="stack-item-type">{{ typeLabel(obj) }}</div>
          <div class="stack-item-name">{{ obj.sourceCardName }}</div>
          <div class="stack-item-controller">Cast by {{ obj.caster }}</div>
          <div class="stack-targets" *ngIf="obj.targets.length">
            Target:
            <span *ngFor="let target of obj.targets; trackBy: trackTarget; let last = last"
              >{{ target.label ?? target.id }}{{ last ? '' : ', ' }}</span
            >
          </div>
        </button>
      </ng-container>
    </div>
  </div>
</ng-container>

<app-card-options-menu
  *ngIf="contextStack"
  [x]="contextX"
  [y]="contextY"
  (inspect)="inspect()"
  (dismiss)="dismiss()"
></app-card-options-menu>
