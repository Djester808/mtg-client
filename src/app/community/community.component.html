<div class="community-page">
  <!-- appScrollEdges supplies can-scroll-left / can-scroll-right; the stylesheet fades
       whichever edge has more strip past it. -->
  <div class="community-tabs" #tabs appScrollEdges>
    <a class="community-tab" routerLink="forum" routerLinkActive="active">
      <i class="bi bi-collection-fill"></i>
      <!-- "Community" is dropped on a phone rather than the whole label being scrolled
           off: three tabs fit across 375px only if the longest one gives up its
           redundant word — you are already on the Community page. -->
      <span class="tab-word-optional">Community </span>Decks
    </a>
    <a class="community-tab" routerLink="commanders" routerLinkActive="active">
      <i class="bi bi-shield-fill"></i>
      Commanders
    </a>
    <a class="community-tab" routerLink="players" routerLinkActive="active">
      <i class="bi bi-people-fill"></i>
      Players
    </a>
  </div>

  <router-outlet></router-outlet>
</div>
